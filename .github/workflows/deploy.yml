name: Deploy Backend with Flyway (OCI)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ===============================
      # FLYWAY - MIGRATIONS
      # ===============================
      - name: Run Flyway migrations
        run: ./mvnw flyway:migrate -Dspring.profiles.active=prod
        env:
          FLYWAY_URL: ${{ secrets.DB_URL }}
          FLYWAY_USER: ${{ secrets.DB_USER }}
          FLYWAY_PASSWORD: ${{ secrets.DB_PASSWORD }}

      # ===============================
      # BUILD (JAR)
      # ===============================
      - name: Build application
        run: ./mvnw clean package -DskipTests

      # ===============================
      # DOCKER BUILD & PUSH
      # ===============================
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USER }}" --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USER }}/churninsight-backend:latest .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USER }}/churninsight-backend:latest
